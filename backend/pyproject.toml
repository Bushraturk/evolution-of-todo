[project]
name = "todo-backend"
version = "2.0.0"
description = "FastAPI backend for Todo App Phase II"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    {name = "Bushraturk", email = "bushrahussain068@gmail.com"}
]

dependencies = [
    "fastapi>=0.109.0",
    "sqlmodel>=0.0.14",
    "uvicorn[standard]>=0.27.0",
    "python-dotenv>=1.0.0",
    "psycopg2-binary>=2.9.9",
    "PyJWT[crypto]>=2.8.0",
    "httpx>=0.26.0",
    "passlib[bcrypt]>=1.7.4",
    "aiokafka>=0.8.0",
    "dapr-ext-fastapi>=1.12.0",
    "resend>=0.7.0",
    "alembic>=1.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.26.0",
    "pytest-cov>=4.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["src"]
