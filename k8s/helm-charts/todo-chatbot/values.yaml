# Default values for todo-chatbot Helm chart
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Global settings
global:
  environment: development
  domain: localhost
  imagePullPolicy: IfNotPresent

# Backend service configuration
backend:
  # Docker image configuration
  image:
    repository: todo-backend
    tag: latest
    pullPolicy: IfNotPresent

  # Number of pod replicas
  replicas: 1

  # Resource requests and limits
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Environment variables (non-sensitive)
  env:
    LOG_LEVEL: INFO
    CORS_ORIGINS: "http://localhost:3000"
    MAX_CONVERSATION_HISTORY: "50"
    CONVERSATION_ARCHIVE_DAYS: "90"
    LLM_REQUEST_TIMEOUT: "30"
    LLM_MAX_RETRIES: "3"

  # Service configuration
  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000

  # Health check configuration
  healthCheck:
    livenessProbe:
      enabled: true
      path: /health
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
    readinessProbe:
      enabled: true
      path: /health
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 2
    startupProbe:
      enabled: true
      path: /health
      initialDelaySeconds: 0
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 12

  # Security context
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
    capabilities:
      drop:
        - ALL

# Frontend service configuration
frontend:
  # Docker image configuration
  image:
    repository: todo-frontend
    tag: latest
    pullPolicy: IfNotPresent

  # Number of pod replicas
  replicas: 1

  # Resource requests and limits
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

  # Environment variables (non-sensitive)
  env:
    NEXT_PUBLIC_API_URL: "http://backend:8000"
    NODE_ENV: production

  # Service configuration
  service:
    type: LoadBalancer
    port: 80
    targetPort: 3000

  # Health check configuration
  healthCheck:
    livenessProbe:
      enabled: true
      path: /api/health
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
    readinessProbe:
      enabled: true
      path: /api/health
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 2

  # Security context
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
    capabilities:
      drop:
        - ALL

# Secrets configuration (values provided at deployment time)
secrets:
  DATABASE_URL: ""
  GROQ_API_KEY: ""
  JWT_SECRET: ""
  GROQ_BASE_URL: "https://api.groq.com/openai/v1"
  GROQ_MODEL: "llama-3.3-70b-versatile"

# ConfigMap configuration (non-sensitive)
configMap:
  APP_NAME: "Todo Chatbot"
  APP_VERSION: "1.0.0"
  ENVIRONMENT: "development"

# Service account configuration
serviceAccount:
  create: true
  name: todo-chatbot
  annotations: {}

# Ingress configuration (optional, not used in Phase V)
ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: todo-chatbot.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Autoscaling configuration (optional, not used in Phase V)
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Pod disruption budget (optional, not used in Phase V)
podDisruptionBudget:
  enabled: false
  minAvailable: 1

# Network policy (optional, not used in Phase V)
networkPolicy:
  enabled: false

# Node selector (optional)
nodeSelector: {}

# Tolerations (optional)
tolerations: []

# Affinity rules (optional)
affinity: {}
