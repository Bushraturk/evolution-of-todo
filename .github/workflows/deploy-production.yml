name: Deploy to Production

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (e.g., v1.0.0)'
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-production:
    name: Deploy to Production Environment
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: production
      url: https://todoapp.example.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.12.0'

      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBECONFIG_PRODUCTION }}" | base64 -d > kubeconfig
          export KUBECONFIG=kubeconfig

      - name: Create backup
        run: |
          # Backup current deployment
          kubectl get deployment todo-backend -n production -o yaml > backup-backend.yaml
          kubectl get deployment todo-frontend -n production -o yaml > backup-frontend.yaml
          echo "Backup created"

      - name: Deploy with Helm
        run: |
          VERSION=${{ github.ref_name }}
          if [ -z "$VERSION" ]; then
            VERSION=${{ github.event.inputs.version }}
          fi

          helm upgrade --install todo-app ./k8s/helm-charts/todo-chatbot \
            --namespace production \
            --create-namespace \
            --values ./k8s/helm-charts/todo-chatbot/values-production.yaml \
            --set backend.image.tag=${VERSION} \
            --set frontend.image.tag=${VERSION} \
            --set backend.env.DATABASE_URL=${{ secrets.DATABASE_URL_PRODUCTION }} \
            --set backend.env.JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY_PRODUCTION }} \
            --set backend.env.GROQ_API_KEY=${{ secrets.GROQ_API_KEY }} \
            --set backend.env.RESEND_API_KEY=${{ secrets.RESEND_API_KEY }} \
            --wait \
            --timeout 10m

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/todo-backend -n production --timeout=5m
          kubectl rollout status deployment/todo-frontend -n production --timeout=5m

      - name: Run health checks
        run: |
          # Wait for services to stabilize
          sleep 60

          # Test backend health endpoint
          kubectl run health-check --image=curlimages/curl:latest --rm -i --restart=Never -n production -- \
            curl -f http://todo-backend:8001/health || exit 1

          # Test frontend
          kubectl run frontend-check --image=curlimages/curl:latest --rm -i --restart=Never -n production -- \
            curl -f http://todo-frontend:3000 || exit 1

          echo "Health checks passed!"

      - name: Run smoke tests
        run: |
          # Test API endpoints
          kubectl run api-test --image=curlimages/curl:latest --rm -i --restart=Never -n production -- \
            curl -f http://todo-backend:8001/api/tasks || exit 1

          echo "Smoke tests passed!"

      - name: Monitor for errors
        run: |
          # Check for errors in logs
          echo "Checking backend logs..."
          kubectl logs -l app=todo-backend -n production --tail=100 | grep -i error || true

          echo "Checking frontend logs..."
          kubectl logs -l app=todo-frontend -n production --tail=100 | grep -i error || true

      - name: Rollback on failure
        if: failure()
        run: |
          echo "❌ Deployment failed, initiating rollback..."
          helm rollback todo-app -n production
          kubectl rollout status deployment/todo-backend -n production --timeout=5m
          kubectl rollout status deployment/todo-frontend -n production --timeout=5m
          echo "Rollback completed"

  post-deployment:
    name: Post-Deployment Tasks
    runs-on: ubuntu-latest
    needs: deploy-production
    if: success()

    steps:
      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          body: |
            ## Changes in this Release

            Deployed to production on ${{ github.event.head_commit.timestamp }}

            ### Deployment Details
            - Backend Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:${{ github.ref_name }}
            - Frontend Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:${{ github.ref_name }}

            ### Verification
            - Health checks: ✅ Passed
            - Smoke tests: ✅ Passed
          draft: false
          prerelease: false

      - name: Notify team
        run: |
          echo "✅ Production deployment successful!"
          echo "Version: ${{ github.ref_name }}"
          echo "Deployed at: $(date)"

  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [deploy-production, post-deployment]
    if: always()

    steps:
      - name: Send notification
        run: |
          if [ "${{ needs.deploy-production.result }}" == "success" ]; then
            echo "✅ Production deployment successful"
            echo "Version: ${{ github.ref_name }}"
          else
            echo "❌ Production deployment failed"
            echo "Rollback initiated"
          fi
