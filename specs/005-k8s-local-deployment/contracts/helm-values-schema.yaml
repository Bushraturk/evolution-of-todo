# Helm Values Schema

# This file documents the structure and expected values for the Helm chart values.yaml
# Use this as a reference when creating or modifying values files

# Global settings (shared across all components)
global:
  # Environment name (development, staging, production)
  environment: development

  # Domain for external access
  domain: localhost

  # Image pull policy (Always, IfNotPresent, Never)
  imagePullPolicy: IfNotPresent

# Backend service configuration
backend:
  # Docker image configuration
  image:
    # Image repository name (without registry)
    repository: todo-backend

    # Image tag (version identifier)
    tag: latest

    # Image pull policy override (optional)
    pullPolicy: IfNotPresent

  # Number of pod replicas
  replicas: 1

  # Resource requests and limits
  resources:
    requests:
      # Minimum CPU (millicores)
      cpu: 100m
      # Minimum memory
      memory: 256Mi
    limits:
      # Maximum CPU (millicores)
      cpu: 500m
      # Maximum memory
      memory: 512Mi

  # Environment variables (non-sensitive)
  env:
    # Log level (DEBUG, INFO, WARNING, ERROR)
    LOG_LEVEL: INFO

    # CORS allowed origins (comma-separated)
    CORS_ORIGINS: "http://localhost:3000"

    # Maximum conversation history messages
    MAX_CONVERSATION_HISTORY: "50"

    # Conversation archive days
    CONVERSATION_ARCHIVE_DAYS: "90"

    # LLM request timeout (seconds)
    LLM_REQUEST_TIMEOUT: "30"

    # LLM max retries
    LLM_MAX_RETRIES: "3"

  # Service configuration
  service:
    # Service type (ClusterIP, NodePort, LoadBalancer)
    type: ClusterIP

    # Service port
    port: 8000

    # Target container port
    targetPort: 8000

  # Health check configuration
  healthCheck:
    # Liveness probe
    livenessProbe:
      enabled: true
      path: /health
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3

    # Readiness probe
    readinessProbe:
      enabled: true
      path: /health
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 2

    # Startup probe
    startupProbe:
      enabled: true
      path: /health
      initialDelaySeconds: 0
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 12  # 60 seconds max startup time

  # Security context
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
    capabilities:
      drop:
        - ALL

# Frontend service configuration
frontend:
  # Docker image configuration
  image:
    # Image repository name (without registry)
    repository: todo-frontend

    # Image tag (version identifier)
    tag: latest

    # Image pull policy override (optional)
    pullPolicy: IfNotPresent

  # Number of pod replicas
  replicas: 1

  # Resource requests and limits
  resources:
    requests:
      # Minimum CPU (millicores)
      cpu: 50m
      # Minimum memory
      memory: 128Mi
    limits:
      # Maximum CPU (millicores)
      cpu: 200m
      # Maximum memory
      memory: 256Mi

  # Environment variables (non-sensitive)
  env:
    # Backend API URL (internal cluster DNS)
    NEXT_PUBLIC_API_URL: "http://backend:8000"

    # Node environment
    NODE_ENV: production

  # Service configuration
  service:
    # Service type (ClusterIP, NodePort, LoadBalancer)
    type: LoadBalancer

    # Service port (external)
    port: 80

    # Target container port
    targetPort: 3000

  # Health check configuration
  healthCheck:
    # Liveness probe
    livenessProbe:
      enabled: true
      path: /api/health
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3

    # Readiness probe
    readinessProbe:
      enabled: true
      path: /api/health
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 2

  # Security context
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
    capabilities:
      drop:
        - ALL

# Secrets configuration (values provided at deployment time)
secrets:
  # Database connection string
  # Format: postgresql://user:password@host:port/database
  DATABASE_URL: ""

  # Groq API key for LLM
  # Format: gsk_xxx
  GROQ_API_KEY: ""

  # JWT secret for authentication
  # Format: random string (min 32 characters)
  JWT_SECRET: ""

  # Groq base URL
  GROQ_BASE_URL: "https://api.groq.com/openai/v1"

  # Groq model name
  GROQ_MODEL: "llama-3.3-70b-versatile"

# ConfigMap configuration (non-sensitive)
configMap:
  # Application name
  APP_NAME: "Todo Chatbot"

  # Application version
  APP_VERSION: "1.0.0"

  # Environment
  ENVIRONMENT: "development"

# Ingress configuration (optional, not used in Phase V)
ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: todo-chatbot.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Autoscaling configuration (optional, not used in Phase V)
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Pod disruption budget (optional, not used in Phase V)
podDisruptionBudget:
  enabled: false
  minAvailable: 1

# Network policy (optional, not used in Phase V)
networkPolicy:
  enabled: false

# Service account configuration
serviceAccount:
  # Create service account
  create: true

  # Service account name
  name: todo-chatbot

  # Annotations
  annotations: {}

# Node selector (optional)
nodeSelector: {}

# Tolerations (optional)
tolerations: []

# Affinity rules (optional)
affinity: {}
